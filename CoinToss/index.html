<html lang="en">
<head>
<meta charset="UTF-8" />

<title>CoinToss</title>
<style>
  * { box-sizing: border-box; }
  html, body { overflow: hidden; }
  body { margin:0; min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2rem;
    font-family:system-ui,sans-serif; color:#f8fafc; background:radial-gradient(circle at top,#312e81,#0f172a); user-select:none; -webkit-user-select:none; }
  h1 { margin:0; font-weight:300; letter-spacing:.2em; text-transform:uppercase; }
  .scene { perspective:900px; }
  .coin { width:200px; height:200px; position:relative; transform-style:preserve-3d; cursor:pointer; border:0; background:none; padding:0; display:block; }
  .face { position:absolute; inset:0; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:4rem; font-weight:700;
    backface-visibility:hidden; -webkit-backface-visibility:hidden; color:#78350f;
    background:radial-gradient(circle at 30% 30%,#fde68a,#f59e0b 60%,#b45309); border:8px solid #fbbf24; box-shadow:0 10px 30px rgba(0,0,0,.5), inset 0 0 20px rgba(120,53,15,.5); }
  .face svg { overflow:visible; width:62%; height:62%; filter:drop-shadow(1px 2px 0 rgba(254,243,199,.6)); }
  .tails { transform:rotateY(180deg); }
  #result { font-size:1.5rem; min-height:2rem; }
  #hint { opacity:.6; font-size:.9rem; text-align:center; padding:0 1rem; }
  #enable { display:none; padding:.6rem 1.2rem; border-radius:999px; border:0; font-size:1rem; background:#fbbf24; color:#78350f; cursor:pointer; }
  @media (prefers-reduced-motion: reduce) { .coin { transition:none !important; } }
</style>

  <div id="result" aria-live="polite">&nbsp;</div>
  <button id="enable">Enable shake to toss</button>
  <p id="hint">Click the coin or shake your phone to toss</p>
<script>
(function () {
  var coin = document.getElementById('coin');
  var result = document.getElementById('result');
  var rotation = 0, tossing = false;
  var DURATION = 1600;

  function toss() {
    if (tossing) return;
    tossing = true;
    result.innerHTML = '&nbsp;';
    var heads = Math.random() < 0.5;
    var spins = 5 + Math.floor(Math.random() * 4);
    var current = rotation % 360;
    var target = heads ? 0 : 180;
    rotation += spins * 360 + ((target - current + 360) % 360);
    var rm = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    var dur = rm ? 0 : DURATION;
    coin.style.transition = 'transform ' + dur + 'ms cubic-bezier(.2,.7,.3,1)';
    coin.animate && !rm && coin.parentNode.animate(
      [{ transform: 'translateY(0) scale(1)' }, { transform: 'translateY(-160px) scale(1.4)', offset: .45 }, { transform: 'translateY(0) scale(1)' }],
      { duration: DURATION, easing: 'ease-in-out' });
    coin.style.transform = 'rotateY(' + rotation + 'deg)';
    setTimeout(function () {
      result.textContent = heads ? 'Heads!' : 'Tails!';
      tossing = false;
    }, dur);
  }

  coin.addEventListener('click', toss);

  var last = 0, lastTime = 0, lastShake = 0;
  function onMotion(e) {
    var a = e.accelerationIncludingGravity;
    if (!a) return;
    var now = Date.now();
    if (now - lastTime < 100) return;
    var sum = (a.x || 0) + (a.y || 0) + (a.z || 0);
    var delta = Math.abs(sum - last);
    last = sum; lastTime = now;
    if (delta > 25 && now - lastShake > 1000) { lastShake = now; toss(); }
  }

  var btn = document.getElementById('enable');
  if (window.DeviceMotionEvent) {
    if (typeof DeviceMotionEvent.requestPermission === 'function') {
      btn.style.display = 'block';
      btn.addEventListener('click', function () {
        DeviceMotionEvent.requestPermission().then(function (s) {
          if (s === 'granted') { window.addEventListener('devicemotion', onMotion); btn.style.display = 'none'; }
        }).catch(function () {});
      });
    } else {
      window.addEventListener('devicemotion', onMotion);
    }
  }
})();
</script>
