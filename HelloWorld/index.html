<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hello World</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background-color: #0d1117;
      color: #c9d1d9;
    }
    .container {
      text-align: center;
      padding: 2.5rem;
      border-radius: 12px;
      background: #161b22;
      border: 1px solid #30363d;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      max-width: 480px;
      width: 90%;
    }
    h1 {
      font-size: 2.5rem;
      color: #58a6ff;
      margin-bottom: 0.75rem;
    }
    p {
      font-size: 1.1rem;
      color: #8b949e;
      line-height: 1.5;
    }
    .badge {
      display: inline-block;
      margin-top: 1.5rem;
      padding: 0.4rem 0.8rem;
      font-size: 0.85rem;
      font-weight: 600;
      color: #f0883e;
      background: rgba(240, 136, 62, 0.15);
      border-radius: 20px;
      border: 1px solid rgba(240, 136, 62, 0.3);
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Hello, World! 👋</h1>
    <p>Your static site is successfully deployed and running on Cloudflare Pages.</p>
    <div class="badge">🚀 Site Status: Online</div>
  </div>
</body>
</html>
